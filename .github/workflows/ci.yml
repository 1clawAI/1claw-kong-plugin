name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Lua and LuaRocks
        uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck kong/ spec/ --std ngx_lua+busted --no-max-line-length

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Lua and LuaRocks
        uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4

      - name: Install dependencies
        run: |
          luarocks install busted
          luarocks install lua-cjson
          luarocks install lua-resty-http

      - name: Run unit tests
        run: |
          busted --verbose spec/unit/
        env:
          # Modules are named kong.plugins.<name>.handler, so the search
          # path has to be rooted at the repo, not at kong/ — the old
          # prefix resolved them to ./kong/kong/plugins/... The trailing
          # ";;" restores the default paths; a literal "$LUA_PATH" does
          # not, because Actions env values are not shell-expanded.
          LUA_PATH: "./?.lua;./?/init.lua;./spec/?.lua;;"

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run integration tests
        run: |
          cd spec/integration
          chmod +x run-tests.sh
          ./run-tests.sh
